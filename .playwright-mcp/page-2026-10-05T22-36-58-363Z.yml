        - emphasis [ref=f8e34]: "Morning and Evening: Daily Readings"
        - text: is arranged by month. It gives one morning meditation and one evening meditation for each day of the year. Each piece opens from a short Scripture text. The Christian Classics Ethereal Library (CCEL) hosts the work and treats the English text as public domain.
