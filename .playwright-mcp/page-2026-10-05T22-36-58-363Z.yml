      - heading "Who Spurgeon is" [level=2] [ref=f8e21]
      - figure "C. H. Spurgeon. Public-domain portrait used on this class site." [ref=f8e22]:
        - img "Portrait of Charles Haddon Spurgeon" [ref=f8e23]
      - paragraph [ref=f8e25]: Charles Haddon Spurgeon (19 June 1834 to 31 January 1892) was an English Particular Baptist preacher. He was born in Kelvedon, England, and died in Menton, France. Wikipedia records that some readers still call him the “Prince of Preachers.”
      - paragraph [ref=f8e26]: He was pastor of the New Park Street Chapel congregation in London, later known as the Metropolitan Tabernacle, for 38 years. The congregation moved into the purpose-built Tabernacle at Elephant and Castle, Southwark, on 18 March 1861. While there he also supported practical work that included a Pastors’ College (later named Spurgeon’s College) and the Stockwell Orphanage.
      - paragraph [ref=f8e27]:
        - text: Spurgeon wrote sermons, commentaries, and devotionals. Many sermons were taken down as he spoke and printed in his lifetime. This class site uses only the public-domain English text of
        - emphasis [ref=f8e28]: Morning and Evening
        - text: .
