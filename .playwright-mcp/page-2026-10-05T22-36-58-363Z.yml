    - generic [ref=f8e37]:
      - heading "Who this site is for" [level=2] [ref=f8e38]
      - paragraph [ref=f8e39]: "Visitor persona: a student or church reader who wants one morning reading and one evening reading they can open without an account. They do not want to install an app or buy a reprint. They also include the CIS 300 instructor who needs to see real pages, a table, a form, and working navigation."
      - paragraph [ref=f8e40]: Home shows today’s full featured pair and an illustrative ink-and-watercolor video. This Week lists seven days in a table and the complete bodies. Contact holds the class form and an email link. Nothing here is a shop or a login.
